# Explicit opt-in only. A separate local database is required; no production defaults.
spring.datasource.url=${LAB_DATABASE_URL:jdbc:postgresql://localhost:55439/everme_lab}
spring.datasource.username=${LAB_DATABASE_USER:everme_lab}
spring.datasource.password=${LAB_DATABASE_PASSWORD:everme_lab}
spring.ai.openai.api-key=${OPENAI_API_KEY:lab-not-configured}
# LabAiConfiguration supplies qualified Spring AI models; per-stage options use lab.*.
lab.api-key=${OPENAI_API_KEY:}
lab.api-base=${LAB_OPENAI_BASE_URL:https://api.openai.com/v1}
lab.generation-model=${LAB_GENERATION_MODEL:gpt-6.1-sol}
lab.analysis-model=${LAB_ANALYSIS_MODEL:gpt-6.1-sol}
lab.answer-model=${LAB_ANSWER_MODEL:gpt-6.1-terra}
lab.embedding-model=${LAB_EMBEDDING_MODEL:text-embedding-3-small}
lab.initialize-schema=${LAB_INITIALIZE_SCHEMA:false}
spring.sql.init.mode=never
mybatis.type-handlers-package=com.example.everme.lab.dao
server.address=${LAB_BIND_ADDRESS:127.0.0.1}
spring.mvc.async.request-timeout=600000
logging.level.com.example.everme.lab=INFO
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

lab.generation-reasoning-effort=${LAB_GENERATION_REASONING_EFFORT:low}
lab.analysis-reasoning-effort=${LAB_ANALYSIS_REASONING_EFFORT:medium}
lab.summary-reasoning-effort=${LAB_SUMMARY_REASONING_EFFORT:medium}
lab.answer-reasoning-effort=${LAB_ANSWER_REASONING_EFFORT:}
